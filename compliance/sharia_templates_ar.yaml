# Same keys as sharia_rules.yaml activity.no_mcc_by_sector (the terms of enums.sector in web/messages/ar.json).
sector_labels:
  construction: "التشييد"
  professional_services: "الخدمات المهنية"
  food_beverage: "الأغذية والمشروبات"
  retail_trade: "تجارة التجزئة"

# The detail lines sharia.py writes itself (rules_triggered[].detail, disclosures[].detail).
details:
  mcc: "رمز فئة التاجر {mcc}: {label}"
  no_mcc: "لا يوجد رمز فئة التاجر، والقطاع المسجّل «{sector}» لا يحدد السلع المبيعة"
  fi_share: "{share} من قيمة التدفقات الواردة مصدرها مؤسسات مالية (الحد {threshold})"
  existing_financing: "دفعات سداد منتظمة لمؤسسة مالية، ونوع التمويل غير معروف"
