  5921: "متاجر بيع البيرة والنبيذ والخمور المعبأة"
  7995: "المراهنات، بما فيها تذاكر اليانصيب وألعاب القمار"
  7800: "اليانصيب المملوك للحكومة"
  7801: "الكازينوهات الإلكترونية المرخّصة حكوميًا"
  7802: "سباقات الخيل والكلاب المرخّصة حكوميًا"
  7273: "خدمات المواعدة والمرافقة"
  5999: "متاجر التجزئة المتنوعة والمتخصصة (تجارة عامة، مزيج السلع غير معروف)"
  5399: "البضائع العامة المتنوعة (مزيج السلع غير معروف)"
  5993: "متاجر السيجار وأكشاكه (التبغ، ويختلف العلماء في حكمه)"
  6012: "المؤسسات المالية (شروطها التقليدية أو الإسلامية غير معروفة)"
