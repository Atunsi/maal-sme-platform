# Arabic drafts, fixed template text only, never generated. Pending review by the owner named in DECISIONS 57.
#
# Arabic siblings of every template compliance/sharia.py formats: the prompts and explanations of
# compliance/sharia_rules.yaml, its MCC labels, and the detail lines written in sharia.py itself. This file
# is separate on purpose: sharia_rules.yaml is untouched, so rule_table_sha256 does not move. Nothing here
# changes a status, a rule or a threshold; it only fills the additive `_ar` fields.
# Formal Arabic (DECISIONS 57, 1a.5). Placeholders stay Latin and are filled with the same values as the
# English templates ({share} and {threshold} with the same formatted percentages).
version: "1.0"
status: draft_pending_review

# Same keys as sharia_rules.yaml `prompts`.
prompts:
  soft_mcc: "رمز فئة التاجر المسجّل لمنشأتك {mcc} ({label}) لا يبيّن بدقة ما تبيعه أو تقدّمه. هل يأتي أي جزء من إيراداتك من منتجات أو خدمات تخالف الضوابط الشرعية؟ وإن كان كذلك، فما نسبته التقريبية؟"
  no_mcc_retail: "لم نجد رمز فئة التاجر لمنشأتك. يُرجى تأكيد السلع الرئيسية التي تبيعها، وهل يأتي أي جزء من إيراداتك من منتجات تخالف الضوابط الشرعية."
  fi_income: "نحو {share} من دفعاتك الواردة مصدرها مؤسسات مالية. هل يشمل ذلك فوائد أو دخلًا آخر يخالف الضوابط الشرعية؟"
  existing_financing: "تسدّد منشأتك دفعات منتظمة لمؤسسة مالية. هل هذا التمويل متوافق مع الضوابط الشرعية (مثل المرابحة أو الإجارة)، أم أنه تمويل بفائدة؟"

# Same keys as sharia_rules.yaml `explanations`.
explanations:
  hard_flag: "لا يمكن تمويل هذا الطلب: النشاط المسجّل للمنشأة ({detail}) يخالف الضوابط الشرعية (القاعدة {rule_id})."
  soft_flag: "قبل أن يصبح أي عرض تمويل نهائيًا، يجب أن يجيب المالك عن الأسئلة أعلاه (القاعدة {rule_id})."

# Same codes as sharia_rules.yaml activity.hard_flag_mcc and soft_flag_mcc. Where the English label has a
# bracketed note, the Arabic keeps it after " (", so the owner prompt takes the same short form.
mcc_labels:
