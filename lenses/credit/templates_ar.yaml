# Arabic siblings of the credit lens templates in lenses/credit/model.py (PHRASES, FEATURE_LABELS and
# compliance_tier.units). The English templates are unchanged; these feed the additive `_ar` fields only.
# Formal Arabic (DECISIONS 57, 1a.5). One term per concept (1a.6). Placeholders stay Latin.
#
# Sentence frame: «{label}» {phrase}.  The quoted label stands as the subject, so each phrase is written
# to agree with a masculine subject («كان», «أسهم»), whatever the label's own grammar.
