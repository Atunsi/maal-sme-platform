# =============================================================================
# Synthetic SME generator configuration
# Governed by: Behavioral Profile Feature Schema v2.9 (the schema wins over the SOP)
#   §12  configuration, not randomization — every generative parameter lives here
#   §14  latent-variable-driven labels, sector-conditional shock sensitivity
#   §17  zakat_seed for a non-zero Zakat demo
#   §20  two-stage sector → size sampling, plus age tier | sector × size
#   §22  Hijri seasonality (Ramadan / Eid)
#   §23  two populations: disjoint seeds AND disjoint ID ranges
#   §24  sector-consistent balance sheets
#
# Held-out anomaly types are deliberately NOT in this file (§12). They live only
# in the evaluation harness so precision-at-K is not circular.
# =============================================================================
schema_version: "v2.9"
config_version: "1.0"

# --- §12 window placement ------------------------------------------------------
# 180 days from 2026-02-01 runs to 2026-07-30 and overlaps Ramadan 1447
# (2026-02-18 → 2026-03-19) and Eid al-Fitr (2026-03-20 → 2026-03-22).
start_date: "2026-02-01"
window_days: 180

# --- §23 dual-scale populations ------------------------------------------------
populations:
  research: { seed: 42, id_range: [1, 10000] }
  serving:  { seed: 43, id_range: [10001, 11000] }

# --- §20 stage 1 + stage 2: sector weight, then size | sector -----------------
# Sector weights must sum to 1.0; each size_tiers block must sum to 1.0.
# SOURCE 2026-09-17 (SOP_Monshaat_Unblock Workstream A, DECISIONS.md entry 14): Monsha'at Enterprises
# Statistics 2021 Q4 — the register census, region × ISIC economic activity × size tier, all 13 regions
# summed, large tier excluded (archive sources/monshaat/enterprises_2021Q4.json, SHA-256 in .sha256).
# weight = the sector's SME count ÷ the four-sector SME total (393,608 of 663,913 SMEs nationally);
# size_tiers = micro / small / medium share within the sector. ISIC membership per sector is recorded
# in DECISIONS.md entry 14 (G45+G46+G47; F41+F42+F43; I56; M69+M70+M71+M74+J62). Class B.
# Edition: 2021 Q4 is the newest quarter the gateway serves (dataset 2019 Q2 – 2021 Q4) — four years
# stale, the same vintage as the GASTAT 2022 revenue anchor. Stability across 2019Q4 / 2020Q4 / 2021Q4
# (calibration/out/phase1_sector_mix.json): retail weight 0.446–0.454, construction 0.360–0.425,
# F&B 0.103–0.161, professional 0.026–0.029; micro share 0.64–0.76 in every sector. Register counts are
# a census — no sampling interval; the quarter-to-quarter range is the uncertainty statement.
# Previous (author judgement, class C, until 2026-09-17): retail 0.35 {0.85/0.13/0.02},
# construction 0.20 {0.45/0.40/0.15}, food 0.20 {0.90/0.09/0.01}, professional 0.25 {0.75/0.20/0.05}.
sector_size_distribution:
  retail_trade:          { weight: 0.4498, size_tiers: { micro: 0.7601, small: 0.2191, medium: 0.0208 } }
  construction:          { weight: 0.3599, size_tiers: { micro: 0.7429, small: 0.2288, medium: 0.0283 } }
  food_beverage:         { weight: 0.1611, size_tiers: { micro: 0.7564, small: 0.2238, medium: 0.0198 } }
  professional_services: { weight: 0.0292, size_tiers: { micro: 0.6929, small: 0.2766, medium: 0.0305 } }

# --- §20 stage 3: age tier | sector × size -------------------------------------
# Young businesses skew micro and skew toward F&B/retail; a medium construction
# firm under a year old is rare. "<1yr" businesses begin operating part-way
# through the window (see thin_file), which is what produces the §15 thin-file
# population as a consequence of age rather than an arbitrary carve-out.
age_tier_distribution:
  retail_trade:
    micro:  { "<1yr": 0.30, "1-3yr": 0.35, "3-7yr": 0.25, "7yr+": 0.10 }
    small:  { "<1yr": 0.12, "1-3yr": 0.33, "3-7yr": 0.35, "7yr+": 0.20 }
    medium: { "<1yr": 0.03, "1-3yr": 0.17, "3-7yr": 0.40, "7yr+": 0.40 }
  construction:
    micro:  { "<1yr": 0.22, "1-3yr": 0.38, "3-7yr": 0.28, "7yr+": 0.12 }
    small:  { "<1yr": 0.08, "1-3yr": 0.30, "3-7yr": 0.40, "7yr+": 0.22 }
    medium: { "<1yr": 0.02, "1-3yr": 0.13, "3-7yr": 0.40, "7yr+": 0.45 }
  food_beverage:
    micro:  { "<1yr": 0.35, "1-3yr": 0.35, "3-7yr": 0.22, "7yr+": 0.08 }
    small:  { "<1yr": 0.15, "1-3yr": 0.35, "3-7yr": 0.33, "7yr+": 0.17 }
    medium: { "<1yr": 0.03, "1-3yr": 0.17, "3-7yr": 0.40, "7yr+": 0.40 }
  professional_services:
    micro:  { "<1yr": 0.32, "1-3yr": 0.36, "3-7yr": 0.22, "7yr+": 0.10 }
    small:  { "<1yr": 0.12, "1-3yr": 0.33, "3-7yr": 0.35, "7yr+": 0.20 }
    medium: { "<1yr": 0.03, "1-3yr": 0.17, "3-7yr": 0.40, "7yr+": 0.40 }

thin_file:
  # "<1yr" businesses start operating this many days after the window start
  # (uniform). Anything beyond ~120 leaves < 60 coverage days in the trailing 90
  # → the §15 insufficient_data state appears in the population naturally.
  under_1yr_operating_start_offset_days: [0, 150]

# --- §14 latent variables (hidden; never exposed to any lens) ------------------
latents:
  management_quality: { alpha: 4.0, beta: 4.0 }      # shared across sectors
  market_shock_sensitivity:                         # sector-specific Beta(α_s, β_s)
    retail_trade:          { alpha: 3.0, beta: 3.0 }  # mean 0.50
    construction:          { alpha: 5.0, beta: 2.0 }  # mean 0.71 — highest true risk
    food_beverage:         { alpha: 4.0, beta: 2.5 }  # mean 0.62
    professional_services: { alpha: 2.0, beta: 5.0 }  # mean 0.29 — lowest true risk

# §14 "closes the side door": observables are ρ-correlated noisy reflections of
# the latent risk index, each with its own independent noise term.
latent_to_observable_correlation: 0.6

# Default label: logit(p) = intercept + shock_coef·(shock−0.5) − management_coef·(mgmt−0.5) + N(0, σ)
# The aggregate default rate is NOT set here — it emerges (§21). Coefficients are
# calibration inputs; label_noise_sigma is the §14 reporting axis (AUC vs. noise).
default_label_model:
  intercept: -3.4
  shock_coef: 2.5
  management_coef: 2.0
  label_noise_sigma: 0.2

# How the latent risk index maps onto observable behaviour. U ∈ [0,1] is the
# ρ-correlated, independently-noised rank of the business's latent risk
# (U → 1 = riskier). Each line: value = lo + U·(hi − lo) unless stated.
observable_mapping:
  # Receipt lumpiness (DECISIONS.md #1): the inflow arrival rate is multiplied by
  # a persistent lognormal AR(1) shock — good weeks / bad weeks, not good days /
  # bad days — so it is visible even at 0.3 receipts/day (construction). σ is
  # the stationary sd of the log-rate; persistence φ gives a ~4-day half-life.
  # Poorly-managed businesses have burstier receipts, which is what features 3
  # (timing-interval CV) and 11 (net-flow sd) actually measure. Per-transaction
  # amount noise stays at the sector's daily_cv and carries no latent signal.
  inflow_dispersion_sigma: [0.15, 0.90]      # safe → risky
  inflow_dispersion_persistence: 0.85
  # Second channel, same latent rank: per-receipt amount dispersion. This is
  # what carries the signal in milestone-billed sectors (construction,
  # professional) where ~1 receipt every 3 days leaves timing dominated by the
  # billing cycle itself. × sector daily_cv.
  amount_dispersion_multiplier: [0.7, 1.3]   # safe → risky
  cost_ratio_multiplier: [0.92, 1.08]        # × sector cost_ratio
  opening_balance_months_of_outflow: [2.0, 0.3]   # safe → risky (reversed on purpose)
  window_growth_range: 0.30                  # growth over window = (0.5 − U) × this
  counterparty_dirichlet_alpha: [2.3, 0.3]   # safe → risky (lower α = more concentrated)
  idiosyncratic_scale_sigma: 0.25            # lognormal σ on business size within a tier

# --- sector economics (feeds transactions.csv / daily_aggregates.csv) -----------
sector_economics:
  retail_trade:
    base_monthly_inflow_sar: 60000   # author judgement (class C) — SOP_Saudi_Calibration §10.6: unsourced, deliberately left
    # SOP_Saudi_Calibration Phase 3 (DECISIONS.md entry 13): receipts arrive at the MEASURED average ticket,
    # so the receipt count is base inflow ÷ ticket (~33/day for a micro shop, not the old 5.0 which
    # implied a 400 SAR ticket). Source: SAMA Weekly Points of Sale Transactions bulletin 12-Sep-2026,
    # Table 1, four weeks 16 Aug–12 Sep 2026, Σvalue ÷ Σcount over Apparel + Food & Beverages (grocery) +
    # Electronics + Furniture & Home Supplies + Jewelry (sources/sama/sama_weekly_pos_bulletin_2026-09-12.pdf).
    # Stability: weekly series Jan–Jul 2025 63.4; monthly Table 30d 2023 69.9 (calibration/out/phase3_ticket_size.json).
    avg_inflow_ticket_sar: 61.5      # class B
    outflow_tx_per_day: 1.5
    cost_ratio: 0.86
    recurring_share: 0.30
    rent_share_of_recurring: 0.45
    daily_cv: 0.35
    operating_days: all_week
    weekend_activity: 1.0
    business_hours: [8, 23]
    customer_pool: [40, 200]
    supplier_pool: [4, 12]
    mcc_codes: [5311, 5331, 5411, 5999]
  construction:
    base_monthly_inflow_sar: 180000  # author judgement (class C)
    inflow_tx_per_day: 0.30          # milestone billing: few, large receipts — class C; the POS "Construction & Building Materials" ticket (128 SAR) is consumer purchases, not contractor invoices, and is NOT applied (SOP_Saudi_Calibration §6.1)
    outflow_tx_per_day: 3.0          # materials, fuel, subcontractor draws — most days have a payment
    cost_ratio: 0.85
    recurring_share: 0.45
    rent_share_of_recurring: 0.20
    daily_cv: 0.55                   # per-invoice size dispersion (was 1.10: so heavy-tailed the sample std was set by one invoice)
    operating_days: sun_thu
    weekend_activity: 0.30           # card settlements / online payments still land Fri–Sat
    business_hours: [7, 17]
    customer_pool: [2, 8]
    supplier_pool: [6, 20]
    mcc_codes: [1520, 1711, 1731, 1771]
  food_beverage:
    base_monthly_inflow_sar: 45000   # author judgement (class C)
    # Same bulletin edition as retail: Restaurants & Cafés 29.0 SAR (latest week 27.9; weekly 2025 32.5;
    # monthly 2023 34.9). Bakeries & Pastries read 38.6 in the same bulletin and are not modelled separately.
    avg_inflow_ticket_sar: 29.0      # class B — replaces inflow_tx_per_day 6.0 (implied 250 SAR)
    outflow_tx_per_day: 1.5
    cost_ratio: 0.82
    recurring_share: 0.35
    rent_share_of_recurring: 0.40
    daily_cv: 0.30
    operating_days: all_week
    weekend_activity: 1.0
    business_hours: [10, 24]
    customer_pool: [60, 300]
    supplier_pool: [4, 10]
    mcc_codes: [5812, 5814, 5462]
  professional_services:
    base_monthly_inflow_sar: 90000   # author judgement (class C)
    inflow_tx_per_day: 0.50          # invoice-based — class C; the bulletin's "Professional & Business Services" (53 SAR) is a consumer-facing POS line, NOT applied
    outflow_tx_per_day: 2.2          # subscriptions, travel, contractors
    cost_ratio: 0.70
    recurring_share: 0.65            # payroll-heavy (§24)
    rent_share_of_recurring: 0.15
    daily_cv: 0.50                   # per-invoice size dispersion (was 0.90, same reason as construction)
    operating_days: sun_thu
    weekend_activity: 0.30
    business_hours: [9, 18]
    customer_pool: [3, 15]
    supplier_pool: [2, 8]
    mcc_codes: [7392, 8931, 7372, 8111]

size_tier_scale:    { micro: 1.0, small: 4.0, medium: 15.0 }   # × base_monthly_inflow
size_tier_tx_scale: { micro: 1.0, small: 1.5, medium: 2.5 }    # × tx per day

# Existing obligations (§31, feature 41): share of businesses with a recurring
# repayment to a financial-institution counterparty, and its size.
financing:
  # SOP_Saudi_Calibration Phase 4 + SOP_Monshaat_Unblock A3 (DECISIONS.md entry 14): SAMA bank credit
  # outstanding by economic activity, 2026 Q2 (Individuals' Loans excluded, asserted) ÷ the Monsha'at
  # 2021 Q4 SME count per sector = credit per SME; index normalised to a count-weighted mean of 1 and
  # multiplied by the pinned level 0.35 (calibration/out/phase4_credit_intensity.json). Credit per SME:
  # retail 1.25 M SAR (index 1.10), construction 1.06 M (0.94), food service 0.96 M (0.85),
  # professional 1.28 M (1.12). The RELATIVE shape is measured (class B); the absolute level 0.35 stays
  # author judgement (class C) — total bank credit by activity is not SME credit, has no SME/large
  # split and no NPL field (§7.4), and the numerator (2026) and denominator (2021) are different years.
  share_of_businesses:
    retail_trade: 0.384
    construction: 0.328
    food_beverage: 0.296
    professional_services: 0.394
  monthly_outflow_share: 0.08

# --- §24 sector-consistent balance sheets --------------------------------------
# Position within each band is the ρ-correlated risk rank (slower collection,
# heavier inventory = riskier). Realized implied_* values are recomputed by the
# gate harness from the tables via the §30 formula — the bands below are chosen
# so construction lands inside [60,120] DSO and professional stays < 5 DIO
# after balance-sheet noise, not equal to those limits.
balance_sheet_archetypes:
  retail_trade:          { dso_days: [5, 25],   dio_days: [30, 70],  dpo_days: [20, 45], stl_months_of_outflow: [0.4, 0.9] }
  construction:          { dso_days: [72, 108], dio_days: [3, 12],   dpo_days: [45, 90], stl_months_of_outflow: [1.0, 2.0] }
  food_beverage:         { dso_days: [1, 8],    dio_days: [4, 14],   dpo_days: [15, 40], stl_months_of_outflow: [0.3, 0.7] }
  professional_services: { dso_days: [25, 55],  dio_days: [0.0, 3.5], dpo_days: [5, 20], stl_months_of_outflow: [0.3, 0.6] }
balance_sheet_noise_sd: 0.03

# --- §22 Hijri seasonality -----------------------------------------------------
# Pinned Gregorian dates for Ramadan / Eid al-Fitr (Umm al-Qura based).
# Verify against the official Umm al-Qura calendar before the defense; a table is
# used instead of a runtime Hijri library so the generated data is reproducible
# from this file alone.
ramadan_calendar:
  - { hijri_year: 1445, ramadan_start: "2024-03-11", ramadan_end: "2024-04-09", eid_start: "2024-04-10", eid_end: "2024-04-12" }
  - { hijri_year: 1446, ramadan_start: "2025-03-01", ramadan_end: "2025-03-29", eid_start: "2025-03-30", eid_end: "2025-04-01" }
  - { hijri_year: 1447, ramadan_start: "2026-02-18", ramadan_end: "2026-03-19", eid_start: "2026-03-20", eid_end: "2026-03-22" }
  # 1448 corrected 2026-09-16: Ramadan 1448 has 29 days on the Umm al-Qura calendar (hijridate 2.6.0),
  # so Shawwal 1 = 2027-03-09, not 03-10 (SOP_Saudi_Calibration Phase 0 finding; calibration/hijri.py
  # asserts every row of this table against the converter).
  - { hijri_year: 1448, ramadan_start: "2027-02-08", ramadan_end: "2027-03-08", eid_start: "2027-03-09", eid_end: "2027-03-11" }

# MEASURED for retail_trade and food_beverage from SAMA POS by sector (SOP_Saudi_Calibration Phase 2,
# DECISIONS.md entry 13; measurements in calibration/out/phase2_seasonality.json). Two multipliers per
# window (§5.4): VALUE scales expected daily inflow, COUNT scales the receipt arrival rate; their ratio
# is the average-ticket effect (Ramadan: fewer, larger baskets).
#   ramadan            — §22 NNLS decomposition of SAMA Monetary & Financial Statistics Table 30d,
#                        monthly 2016–2023, 2020 excluded, Gregorian controls + LOWESS adoption trend;
#                        95% CI = leave-one-year-out jackknife (7 years).
#   pre / eid / post   — weekly SAMA POS series 2021–2023, window model with day-overlap weights
#                        (a monthly series cannot resolve the 3-day Eid); jackknife over 3 years.
#   Held out, never refitted: 2024 and 2025 → calibration/out/phase3_holdout.json.
#   Edition: KAPSARC mirror exports archived 2026-09-16, sources/sama/*.meta.json (SHA-256 recorded).
# food_beverage ← "Restaurants & Café" (clean). retail_trade ← value-weighted composite of Clothing and
# Footwear + Beverage and Food + Electronic & Electric Devices + Furniture + Jewelry (entry 13).
# DIRECTION CORRECTION: restaurants FALL in Ramadan (0.82, down in every one of 7 years; count 0.70) and
# spike at Eid (1.66); the previous placeholder had them rising 1.45× / 1.80×. The Eid spike in the POS
# data is CLOTHING (β_Ramadan 1.90, weekly Eid 1.49) — no generator sector isolates it.
# construction / professional_services stay author judgement (class C): the POS "Construction &
# Building Materials" line (β_Ramadan 0.71) measures consumers buying materials, not contractor
# receipts, and no POS line measures professional-services revenue. Not applied (§5.3).
seasonality_value_multiplier:
  retail_trade:          { pre_ramadan_10d: 1.28, ramadan: 1.34, eid: 0.94, post_eid_7d: 0.84, evidence_class: B }  # CI: pre [0.68,1.88] ramadan [1.28,1.39] eid [0.19,1.69] post [0.73,0.94]
  food_beverage:         { pre_ramadan_10d: 1.00, ramadan: 0.82, eid: 1.66, post_eid_7d: 0.96, evidence_class: B }  # CI: pre [0.67,1.32] ramadan [0.76,0.87] eid [1.44,1.89] post [0.95,0.98]
  construction:          { pre_ramadan_10d: 1.00, ramadan: 0.80, eid: 0.25, post_eid_7d: 0.90, evidence_class: C }  # unchanged judgement; POS does not measure contractor revenue
  professional_services: { pre_ramadan_10d: 1.00, ramadan: 0.90, eid: 0.40, post_eid_7d: 0.95, evidence_class: C }  # unchanged judgement; no POS line
seasonality_count_multiplier:
  retail_trade:          { pre_ramadan_10d: 1.09, ramadan: 1.12, eid: 0.95, post_eid_7d: 0.86, evidence_class: B }  # CI: pre [0.84,1.35] ramadan [1.05,1.20] eid [0.75,1.15] post [0.79,0.94]
  food_beverage:         { pre_ramadan_10d: 1.00, ramadan: 0.70, eid: 0.97, post_eid_7d: 0.92, evidence_class: B }  # CI: pre [0.82,1.19] ramadan [0.66,0.73] eid [0.92,1.03] post [0.87,0.97]
  construction:          { pre_ramadan_10d: 1.00, ramadan: 1.00, eid: 1.00, post_eid_7d: 1.00, evidence_class: C }  # count seasonality of B2B receipts unmeasured
  professional_services: { pre_ramadan_10d: 1.00, ramadan: 1.00, eid: 1.00, post_eid_7d: 1.00, evidence_class: C }

# --- demo businesses (serving population; §12, §17) ----------------------------
# Fully specified so the two required contrasts are reproducible on demand:
#   10001  window overlaps Ramadan 1447; zakat-seeded (hawl completes in-window)
#   10002  window placed entirely outside Ramadan; no zakat seed → hawl_incomplete
#   10003  "<1yr" professional-services firm operating < 60 days → insufficient_data
# Injected anomaly types listed here are the *known* set. Held-out types: harness only.
demo_businesses:
  - id: 10001
    name: "Ramadan-overlap retail (zakat-seeded)"
    sector: retail_trade
    size_tier: small
    age_tier: "3-7yr"
    start_date: "2026-02-01"
    zakat_seed: { hawl_start_date: "2025-08-01", opening_net_assets_sar: 120000 }
    inject_cash_crunch: { week: 18, severity_pct: 30 }
    inject_anomalies:
      - { type: large_transfer, week: 9 }
      - { type: odd_hours_transaction, week: 11 }
  - id: 10002
    name: "Non-overlap retail (no zakat seed)"
    sector: retail_trade
    size_tier: small
    age_tier: "3-7yr"
    start_date: "2025-08-01"        # 180 days → 2026-01-27, ends before Ramadan 1447
  - id: 10003
    name: "Thin-file professional services"
    sector: professional_services
    size_tier: micro
    age_tier: "<1yr"
    start_date: "2026-02-01"
    operating_start_date: "2026-06-20"   # ~40 operating days → coverage < 60

# --- §21 emergent validation targets (pre-registered BEFORE any validation run) --
# The generator is never told these. Each carries a tolerance band committed
# here so "did you tune until it matched?" has a dated answer. A miss is a
# FINDING — status_on_fail is never "retune".
emergent_validation_targets:
  # Published figures the targets are derived from. Kept as raw numbers so the
  # derivation is visible, not a pre-digested ratio. Checked by validate_emergent.py.
  published_sources:
    gastat_2022_sme_revenue_bn_sar:
      source: "GASTAT, 'Operating Revenues by Economic Activity and Size 2022'"
      source_status: archived   # §21 source discipline satisfied — see archive_path
      archive_path: "sources/gastat/SME_2022.xlsx"
      archive_sheet: "الايرادات التشغيلية"  # Operating Revenues; rows keyed by ISIC letter, cols B/C/D = Micro/Small/Medium (thousand SAR)
      archived_on: "2026-09-15"
      note: >
        Four modelled sectors only, exact figures from the archived workbook
        (thousand SAR / 1e6, ISIC row → sector): G 'Wholesale and retail
        trade' → retail_trade; F 'Construction' → construction; I
        'Accommodation and food service' → food_beverage; M 'Professional
        activities' → professional_services. The workbook's own Total row
        (all activities, all tiers) is the source for the
        all_sectors_context_only target below: medium share =
        684,379,007.65 / 1,456,380,093.23 = 0.470.
      retail_trade:          { micro: 259.950221, small: 130.858815, medium: 126.543103 }
      construction:          { micro: 34.913537,  small: 74.416527,  medium: 111.022996 }
      food_beverage:         { micro: 18.035476,  small: 33.249549,  medium: 40.333973 }
      professional_services: { micro: 4.255456,   small: 10.141435,  medium: 18.098164 }
  # RECLASSIFIED 2026-09-16 (SOP_Saudi_Calibration_Sources §2.2, DECISIONS.md entry 12): the three
  # revenue-share metrics below are NOT emergent. They are closed-form functions of four calibration
  # inputs and involve no simulation:
  #     revenue_weight(sector) = weight × base_monthly_inflow_sar × Σ_tier p(tier) × size_tier_scale[tier]
  # Worked from this file: retail 35,070 / construction 154,800 / F&B 12,690 / professional 51,750
  # → 13.8% / 60.9% / 5.0% / 20.3%, reproducing the harness figures (13.9% / 60.6%) to within rounding.
  # They stay here as CONSISTENCY CHECKS on the inputs against GASTAT — never as evidence that the
  # simulation reproduced anything. validate_emergent.py prints them under their own heading.
  calibration_derived_checks:
    - metric: revenue_share_medium_tier
      basis: modelled_sectors                  # like-for-like: same four sectors as the generator
      definition: "sum(inflow_total | size_tier=medium) / sum(inflow_total), research population — closed form: Σ_s w_s·base_s·p_s(medium)·scale_medium / Σ_s w_s·base_s·E[scale|s]"
      derived_from: gastat_2022_sme_revenue_bn_sar   # → 0.343
      tolerance_rel: 0.15
      status_on_fail: report_as_finding
    - metric: revenue_share_medium_tier
      basis: all_sectors_context_only          # NOT comparable: includes sectors the generator does not model
      published_value: 0.470                   # workbook Total row, all 18 ISIC activities — see note above
      source: "GASTAT, 'Operating Revenues by Economic Activity and Size 2022' — Total row"
      comparable: false
    - metric: sector_revenue_share
      definition: "sector share of total inflow_total, research population; total-variation distance ½Σ|p−q| (sectors are unordered, so KS is not defined)"
      derived_from: gastat_2022_sme_revenue_bn_sar
      tolerance_abs: 0.10
      status_on_fail: report_as_finding
    - metric: within_sector_size_revenue_share
      definition: "per sector: revenue share by size tier (micro<small<medium ordered); KS D = max|F_sim − F_pub|"
      derived_from: gastat_2022_sme_revenue_bn_sar
      tolerance_abs: 0.10
      status_on_fail: report_as_finding
  # Genuinely emergent targets — no closed form; each needs the simulation to run (SOP_Saudi_Calibration §2.3).
  targets:
    - metric: days_negative_balance_distribution
      definition: >
        Distributional SHAPE of days_negative_balance_90d over scorable research businesses: share with
        ≥ 1 negative day, and the 50th / 90th / 99th percentiles among those. Emerges from opening-balance
        bands, cost ratios, receipt lumpiness and latent shocks interacting over 180 days — no closed form.
      source: "No Saudi SME source. Berka: 6.4% of accounts ever negative over their full history (Probe 1) — directional context only, different population and horizon"
      source_status: pending_no_saudi_series
      published_value: null
      comparable: false
      tolerance_abs: null
      status_on_fail: report_as_finding
    - metric: realised_dso_vs_archetype
      definition: >
        Per sector, the median implied_dso_days recomputed by the harness from balances_monthly and
        daily_aggregates (§30 formula, after balance-sheet noise and receipt lumpiness) must fall inside
        the §24 archetype dso_days band the generator was given. Tests the balance-sheet machinery, not
        a published figure. Reference: balance_sheet_archetypes in this file.
      source: "config-internal (machinery test)"
      source_status: not_applicable
      tolerance: inside_band
      status_on_fail: report_as_finding
    - metric: ramadan_amplitude_recovered
      definition: >
        Fit the §22 window decomposition to the GENERATED data — per sector, research population,
        full-window businesses only: OLS of log(sector daily inflow total) and log(sector daily inflow
        count) on a linear trend, day-of-week dummies and the four Hijri window dummies
        (pre_ramadan_10d, ramadan, eid, post_eid_7d). exp(coef) must recover the seasonality multipliers
        this file supplies, value and count separately. Tests the seasonality wiring (§22), not the
        parameters. Reference: seasonality_value_multiplier / seasonality_count_multiplier (or the
        legacy seasonality_multipliers block, with count multipliers of 1.0).
      source: "config-internal (machinery test)"
      source_status: not_applicable
      tolerance_abs: 0.08
      status_on_fail: report_as_finding
    - metric: aggregate_default_rate
      definition: "mean(default_label), research population"
      source: "SAMA Financial Stability Report — SME-specific NPL series, if one exists (§21 Week-1 check)"
      source_status: pending_week1_check     # drop this target if no citable SME series exists
      published_value: null
      tolerance_rel: null
      status_on_fail: report_as_finding
    # SOP_Data_Grounding §8.3 — registered 2026-09-16, BEFORE the first eval.compare_real run.
    - metric: real_vs_synthetic_signal_strength
      definition: >
        Comparison-set AUC on the Berka real-data holdout versus the same
        comparison-set AUC on the synthetic research population. Same feature
        subset (eval.compare_real.COMPARISON_FEATURES), same model class
        (standardised logistic regression, median imputation), class A
        scale-free features only. Berka: temporal split on loan.date at
        berka.cv_cut_date, primary label set (A vs B) leads, secondary
        (censored) reported alongside. Synthetic: contiguous-ID entity folds,
        research population, no shuffling.
      source: "PKDD'99 Czech Financial Dataset (Berka), Kaggle marceloventura/the-berka-dataset"
      source_status: archived
      archive_path: "sources/berka/"
      basis: scale_free_class_a_features_only
      tolerance_abs: 0.10        # |AUC_synth − AUC_berka|
      status_on_fail: report_as_finding   # never: retune
  # Calibration inputs, listed so they are never mistaken for emergent targets:
  #   sector count weights, size | sector, age | sector×size, latents, ρ,
  #   base_monthly_inflow_sar, size_tier_scale, avg ticket sizes, seasonality multipliers.
  #   The revenue shares are a multiplication of the first six (see calibration_derived_checks
  #   above); they were removed from `targets` on 2026-09-16 for that reason, BEFORE any
  #   size-mix correction from Monsha'at was applied (SOP_Saudi_Calibration §2.2 ordering rule).

# --- SOP_Data_Grounding §13: parameters for the dimensions no public dataset contains ---
# Two blocks, deliberately separate. `grounded_from_berka` = measured on the Berka transaction
# corpus (labels held out) — class B. `ungrounded` = author judgement with a `basis:` string —
# class C, never an emergent target, reported as a sensitivity RANGE (eval.sensitivity).
grounded_from_berka:
  source: "sources/berka/ (PKDD'99), measured 2026-09-16 by the script recorded in DECISIONS.md entry 11"
  loan_duration_months: { 12: 0.192, 24: 0.202, 36: 0.191, 48: 0.202, 60: 0.213 }   # loan.duration, n=682
  standing_orders_per_account: { 1: 0.560, 2: 0.253, 3: 0.111, 4: 0.061, 5: 0.017 } # order table, 3,758 accounts with orders
  share_of_accounts_with_orders: 0.835
  order_amount_share_of_monthly_outflow_lognormal: { mu: -1.848, sigma: 1.381 }     # median 0.20 of monthly outflow
  bank_fee_tier_mix: { base: 0.925, double: 0.054, high: 0.021 }                    # SLUZBY: 14.6 / 30 / 100 CZK → ×1 / ×2.05 / ×6.85
  bank_fee_tier_multipliers: { base: 1.0, double: 2.05, high: 6.85 }
  declared_order_execution_amount_cv: 0.0     # standing orders execute at a fixed amount; DD variability is NOT grounded

ungrounded:
  direct_debits:
    share_of_businesses: 0.55
    count_weights_from: standing_orders_per_account     # count 1–5 drawn with the Berka weights (B); existence share is C
    amount_cv: 0.25              # collection-to-collection variation (never observable in the additive obligations table)
    seasonal_amplitude: 0.30     # utility load; no Saudi source located
    cancellation_prob_90d_by_latent_risk: [0.02, 0.30]   # safe → risky; must correlate with latent distress or 64 is noise
    basis: >
      Magnitude (share of monthly outflow) and count grounded in Berka order distributions.
      Existence share, variability, seasonality and the cancellation coupling are author
      judgement. No public mandate dataset exists.
  scheduled_payments:
    share_of_businesses: 0.30
    count: [1, 2]
    amount_multiple_of_median_supplier_payment: [1.0, 4.0]
    days_ahead: [1, 90]
    basis: "One-off dated commitments placed in the forward window; no public source."
  obligations:
    balloon_share_of_loans: 0.20
    balloon_final_amount_multiple: [3.0, 12.0]
    basis: "Balloon share and size: no public source. Without it feature 65 is identically zero."
  credit_facilities:
    share_with_facility: 0.40
    limit_months_of_outflow: [0.5, 3.0]
    type_mix: { pre_agreed: 0.80, emergency: 0.15, temporary: 0.05 }
    included_in_balance: true                   # AIS `Included` flag semantics
    utilisation_by_latent_risk: [0.05, 0.85]    # safe → risky
    utilisation_noise_sd: 0.10
    emergency_line_appears_if_utilisation_above: 0.90
    basis: >
      Facility existence and tier structure informed by published Saudi overdraft product
      terms. The behavioural coupling between latent distress and utilisation is author
      judgement; no public source pairs facility state with outcomes.
  transaction_subfields:
    transfer_value_date_lag_days: { 0: 0.60, 1: 0.30, 2: 0.10 }   # transfers only; cash, card, standing orders lag 0
    charge_probability_on_transfers: 0.50
    base_fee_sar: 5.0            # level is judgement; the tier MIX and multipliers are Berka-measured (B)
    basis: "Berka has no value date. Lag distribution and the SAR fee level are author judgement."
  mcc_coverage_share:            # §12.3 preferred option: MCC exists only on card-accepting merchants
    retail_trade: 0.90
    food_beverage: 0.90
    construction: 0.15
    professional_services: 0.25
    basis: "No published acquirer-coverage figure by sector was located; shares are judgement."

# --- profile engine -------------------------------------------------------------
profile_engine:
  hazard_seed: 0                       # §34 features 52–54 Monte Carlo seed (per-business RNG keyed on this + business_id)
  # §15 hard eligibility rule (coverage_days_90d ≥ 60). The 60 is a daily-activity Saudi-SME
  # assumption; on real 1990s Czech retail accounts the MEDIAN account has 13 active days per 90
  # and 60 excludes 100% of accounts (DECISIONS.md entry 9 — a FINDING about the rule, recorded
  # before any model was run). Every Berka number is labelled with the threshold it was scored under.
  coverage_min_days_by_source:
    synthetic: 60
    sandbox: 60
    external_real: 10

# --- Berka real-data evaluation (SOP_Data_Grounding §7.3) -------------------------
berka:
  cv_cut_date: "1997-01-01"            # temporal split on loan.date: train before, validate on/after
  n_bootstrap: 1000                    # §8.2: never a Berka point estimate without its interval

# --- output ---------------------------------------------------------------------
output:
  dir: "data"            # git-ignored; regenerate rather than commit (see README)
  quick_dir: "data/quick"
  # §7 says daily_aggregates is "max ~90 rows per business", but features 4, 9
  # and 45 need a prior 90-day window. null = emit the full window (180 rows);
  # set 90 for the literal §7 reading. Needs a change-control decision (§9 SOP).
  daily_aggregates_trailing_days: null
  # SOP_Saudi_Calibration §6.1 (DECISIONS.md entry 13): POS receipts are generated at the measured ticket
  # (~70M rows at full scale, ~7 GB). Resolution chosen: DECOUPLE count from file size — daily_aggregates
  # keep the full counts and totals (features 1–4 read them), while the `sales` rows of POS sectors in
  # transactions.csv are an unbiased thinning at this rate, each carrying sample_weight = 1/rate.
  # Outflows and injected anomaly rows are never thinned; Berka rows are 1.0. Set to 1.0 for a full dump.
  pos_sales_transaction_sample_rate: 0.10
  data_source: synthetic
  # SOP_Data_Grounding §1: base synthetic tables are class B (grounded synthetic).
  # Tables generated from the `ungrounded:` block are stamped C by the generator itself.
  evidence_class: B

quick_mode_n_per_population: 300
