
name: MAAL Daily Gold Price Update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gold-price-pages
  cancel-in-progress: false

jobs:
  update-gold-price:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch latest gold price
        env:
          GOLDAPI_KEY: ${{ secrets.GOLDAPI_KEY }}
        run: python -m lenses.zakat.refresh_gold_price
      
      - name: Prepare public quotation
        run: |
          mkdir -p _site/gold
          cp data/gold_price_latest.json _site/gold/latest.json
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
