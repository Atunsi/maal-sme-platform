name: MAAL Daily Gold Price Update

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

# The quotation is published as gold/latest.json on the gh-pages branch, beside the online demo that branch
# holds. A repository has one GitHub Pages site, served from gh-pages: deploying a Pages artifact from here
# would replace the whole site with this one file, which took the demo offline on 2026-11-10.
permissions:
  contents: write

concurrency:
  group: gold-price-pages
  cancel-in-progress: false

jobs:
  update-gold-price:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch latest gold price
        env:
          GOLDAPI_KEY: ${{ secrets.GOLDAPI_KEY }}
        run: python -m lenses.zakat.refresh_gold_price

      - name: Checkout the published site
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: _pages

      - name: Publish the quotation beside the demo
        working-directory: _pages
        run: |
          mkdir -p gold
          cp ../data/gold_price_latest.json gold/latest.json
          git add gold/latest.json
          if git diff --cached --quiet; then
            echo "Quotation unchanged; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily gold quotation (gold/latest.json)"
          git push origin HEAD:gh-pages
